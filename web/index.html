<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atlas of Ages</title>
<meta name="description" content="Gods, sages and kings across the four ages of Indian sacred history, all connected.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Tiro+Devanagari+Sanskrit:ital@0;1&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky" role="img" aria-label="Map of Indian sacred history: figures and events in bands from creation through the four yugas to 1947, joined by their links"></canvas>
<canvas id="map" hidden role="img" aria-label="Map of South Asia with the places of the epics and of history, lit by what is attested there at the chosen age or year"></canvas>

<nav class="ribbon" id="ribbon" aria-label="Ages"></nav>

<header class="top">
  <div class="brand">
    <h1>Atlas of Ages</h1>
  </div>
  <div class="tools">
    <div class="views" role="group" aria-label="View">
      <a href="#graph" class="btn" id="viewGraph">Graph</a>
      <a href="#map" class="btn" id="viewMap">Map</a>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Find a name" aria-label="Find a name" role="combobox" aria-controls="qres" aria-expanded="false">
      <ul id="qres" role="listbox" aria-label="Matches" hidden></ul>
    </div>
    <button type="button" class="btn" id="storiesBtn" aria-expanded="false" aria-controls="stories">Stories</button>
    <button type="button" class="btn" id="filtersBtn" aria-expanded="false" aria-controls="filters">Filters</button>
    <button type="button" class="btn icon" id="themeBtn" aria-label="Switch light and dark">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.8 5.8 0 1 0 7.1 7.1Z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<section class="filters" id="filters" hidden aria-label="Filters">
  <div class="fgroup">
    <h2>Links</h2>
    <div class="chips" id="linkChips"></div>
  </div>
  <div class="fgroup">
    <h2>Sources</h2>
    <div class="seg" id="tierSeg" role="radiogroup" aria-label="Show sources up to"></div>
  </div>
  <div class="fgroup">
    <h2>Highlight</h2>
    <div class="chips" id="markChips"></div>
    <div class="chips" id="beingChips"></div>
    <div class="chips" id="roleChips"></div>
  </div>
</section>

<section class="filters stories" id="stories" hidden aria-label="Stories">
  <div class="seg" id="storyAges" role="tablist" aria-label="Age"></div>
  <ol class="steps" id="storySteps"></ol>
</section>

<aside class="panel" id="panel" hidden aria-live="polite"></aside>
<aside class="panel" id="mapPanel" hidden aria-live="polite"></aside>

<div class="timebar" id="timebar" hidden>
  <button type="button" class="btn" id="timePlay" aria-pressed="false">Play</button>
  <div class="track">
    <input type="range" id="timeSlider" min="0" max="1" value="0" step="1" aria-label="Age or year">
    <div class="ticks" id="timeTicks" aria-hidden="true"></div>
  </div>
  <output id="timeLabel" for="timeSlider"></output>
  <button type="button" class="btn" id="mapToday" aria-pressed="false">Today's names and borders</button>
</div>

<div class="zoom" aria-label="Zoom">
  <button type="button" class="btn icon" id="zout" aria-label="Zoom out"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <button type="button" class="btn" id="zfit">Fit</button>
  <button type="button" class="btn icon" id="zin" aria-label="Zoom in"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7h8M7 3v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
</div>

<p class="hint" id="hint">Scroll or drag to move, pinch or Ctrl+scroll to zoom, click a name to open it. Press / to search.</p>

<script type="module" src="js/app.js"></script>
</body>
</html>
