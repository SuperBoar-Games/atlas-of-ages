[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "atlas-of-ages"
dynamic = ["version"]
description = "A connected graph of Indian sacred history, from creation through the four yugas to 1947, in RDF."
requires-python = ">=3.11"
dependencies = [
    "rdflib>=7.1",
    "pyshacl>=0.30",
]

[tool.hatch.version]
source = "vcs"

# The project is a data build, not an importable package: the wheel carries only metadata and the version.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[dependency-groups]
dev = [
    "playwright>=1.64.0",
]
